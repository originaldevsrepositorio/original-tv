on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: original-tv-player
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Compilar
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Renomear
        run: cp app/build/outputs/apk/debug/app-debug.apk original-tv.apk

      - uses: actions/upload-artifact@v4
        with:
          name: original-tv-apk
          path: original-tv-player/original-tv.apk

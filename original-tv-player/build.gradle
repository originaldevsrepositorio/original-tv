plugins {
    id 'com.android.application'
}

android {
    namespace 'br.com.originalmeathouse.player'
    compileSdk 34

    defaultConfig {
        applicationId 'br.com.originalmeathouse.player'
        minSdk 21          // Android 5.0+ (cobre a maioria dos TV box)
        targetSdk 34
        versionName '1.1.0'
        versionCode 2

        // TV box usam ARM (32 ou 64 bits); evita embutir x86 e reduz o tamanho do APK
        ndk { abiFilters 'armeabi-v7a', 'arm64-v8a' }

        // Endereço do player carregado pelo app. Para trocar, altere aqui e gere o APK de novo.
        buildConfigField 'String', 'PLAYER_URL', '"https://player.originalmeathouse.com.br"'
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildTypes {
        release {
            minifyEnabled false
            // Assinado com a chave de debug: suficiente para instalar direto no TV box (sideload).
            signingConfig signingConfigs.debug
        }
    }
}

dependencies {
    // Motor de navegador (Firefox) embutido no app: não depende do WebView antigo do TV box.
    implementation 'org.mozilla.geckoview:geckoview-omni:[128.0,129.0)'
}
